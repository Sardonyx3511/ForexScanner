name: Forex Scanner
on:
  workflow_dispatch:
    # Wordt gestart door cron-job.org (via de GitHub API, dagelijks
    # om 23:15 Europe/Amsterdam) EN kan altijd handmatig gestart worden
    # via de "Run workflow"-knop op deze pagina.
    #
    # De ingebouwde GitHub 'schedule'-trigger is bewust verwijderd:
    # die bleek onbetrouwbaar (vertraagde/gemiste triggers) en zorgde
    # voor dubbele runs naast cron-job.org.

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies installeren
        run: pip install -r requirements.txt

      - name: Scanner uitvoeren
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py